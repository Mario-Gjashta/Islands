html/head_include="<script>
// Keep pinch-zoom inside the game. Safari zooms the whole page on pinch: iOS
// ignores user-scalable=no, and Mac trackpads send gesture events Godot
// doesn't read. Block those, and turn trackpad pinches into the ctrl+wheel
// events other browsers send, which the game already zooms on.
(function () {
	var touches = 0;
	var lastScale = 1;
	function count(e) { touches = e.touches ? e.touches.length : 0; }
	document.addEventListener('touchstart', count, { passive: true });
	document.addEventListener('touchend', count, { passive: true });
	document.addEventListener('touchcancel', count, { passive: true });
	document.addEventListener('gesturestart', function (e) {
		e.preventDefault();
		lastScale = 1;
	}, { passive: false });
	document.addEventListener('gesturechange', function (e) {
		e.preventDefault();
		var scale = e.scale || 1;
		var ratio = scale / lastScale;
		lastScale = scale;
		// Two-finger touch pinches already reach the game as touch events.
		if (touches > 0 || Math.abs(ratio - 1) < 0.01) return;
		var canvas = document.getElementById('canvas');
		if (!canvas) return;
		canvas.dispatchEvent(new WheelEvent('wheel', {
			deltaY: ratio > 1 ? -100 : 100,
			ctrlKey: true,
			clientX: e.clientX,
			clientY: e.clientY,
			bubbles: true,
			cancelable: true,
		}));
	}, { passive: false });
	document.addEventListener('gestureend', function (e) { e.preventDefault(); }, { passive: false });
	// iOS double-tap zoom.
	var lastTouchEnd = 0;
	document.addEventListener('touchend', function (e) {
		var now = Date.now();
		if (now - lastTouchEnd < 300) e.preventDefault();
		lastTouchEnd = now;
	}, { passive: false });
})();
</script>"
